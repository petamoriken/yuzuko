name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux jobs link in an older distribution. The release binaries do too,
    # so a symbol that links on the runner's glibc can still be missing here.
    # JavaScript actions need glibc 2.28 inside the container, so Ubuntu 20.04
    # (glibc 2.31) is the oldest image they run in. An empty value runs the
    # job on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            container: ubuntu:20.04
            suite: test
            timeout: 60
          - name: Linux WPT
            os: ubuntu-24.04
            container: ubuntu:20.04
            suite: wpt
            timeout: 360
          - name: macOS
            os: macos-15
            suite: test
            timeout: 60
          - name: macOS WPT
            os: macos-15
            suite: wpt
            timeout: 360
          - name: Windows
            os: windows-2025
            suite: test
            timeout: 60
          - name: Windows WPT
            os: windows-2025
            suite: wpt
            timeout: 360
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # Canvas pixel expectations were recorded on the CPU renderer.
      YUZUKO_CANVAS: cpu
      # CoreAudio on the macOS runner barely wakes, so currentTime stalls
      # after one quantum. The timer fallback keeps the realtime clock moving.
      YUZUKO_AUDIO_TIMER: "1"
    steps:
      # The container starts as root with an empty package list and no git
      # or curl, which checkout and rustup need. Later steps call sudo.
      # The WPT server needs Python 3.9. setup-python installs the runner's
      # Ubuntu build, which needs a newer glibc than this container.
      # DejaVu is a face for the generic families and queryLocalFonts.
      - name: Install Linux packages
        if: matrix.container == 'ubuntu:20.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            sudo \
            build-essential \
            pkg-config \
            python3.9 \
            xvfb \
            fonts-dejavu-core \
            libgtk-3-dev \
            libxdo-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            libvulkan1
          ln -sf /usr/bin/python3.9 /usr/local/bin/python

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Objects linked on the runner's glibc do not belong in this cache.
          shared-key: ${{ matrix.container && 'yuzuko-focal' || 'yuzuko' }}
          save-if: ${{ matrix.suite == 'test' }}

      - name: Restore the V8 static library
        shell: bash
        run: |
          set -euo pipefail
          # rust-cache keeps only build, .fingerprint, and deps. rusty_v8
          # puts librusty_v8.a in target/<profile>/gn_out, so a saved cache
          # does not contain it. Relinking v8 from that cache fails with
          # "could not find native static library `rusty_v8`" unless the
          # build script runs again and downloads the archive.
          shopt -s nullglob
          for profile in target/*/; do
            if [ ! -d "${profile}.fingerprint" ]; then
              continue
            fi
            if [ -e "${profile}gn_out/obj/librusty_v8.a" ] || \
              [ -e "${profile}gn_out/obj/rusty_v8.lib" ]; then
              continue
            fi
            to_remove=(
              "${profile}.fingerprint"/v8-*
              "${profile}build"/v8-*
              "${profile}deps"/libv8-*
              "${profile}deps"/v8-*
            )
            if [ "${#to_remove[@]}" -eq 0 ]; then
              continue
            fi
            echo "rusty_v8 archive missing in ${profile}; discarding cached v8 outputs"
            rm -rf "${to_remove[@]}"
          done

      # Linux WPT uses the container's Python 3.9. setup-python would
      # install the runner's build.
      - name: Install Python
        if: matrix.suite == 'wpt' && matrix.container != 'ubuntu:20.04'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Probe VA-API
        if: runner.os == 'Linux' && matrix.suite == 'test'
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends vainfo libva2 libva-drm2
          echo "--- /dev/dri ---"
          ls -l /dev/dri
          echo "--- vainfo ---"
          vainfo --display drm --device /dev/dri/renderD128

      - name: Install WPT hosts
        if: matrix.suite == 'wpt' && runner.os != 'Windows'
        working-directory: tests/wpt/suite
        run: |
          python wpt make-hosts-file | sudo tee -a /etc/hosts >/dev/null
          grep -q 'web-platform.test' /etc/hosts

      - name: Install WPT hosts
        if: matrix.suite == 'wpt' && runner.os == 'Windows'
        shell: pwsh
        working-directory: tests/wpt/suite
        run: |
          python wpt make-hosts-file | Out-File -FilePath C:\Windows\System32\drivers\etc\hosts -Encoding ascii -Append
          if (-not (Select-String -Path C:\Windows\System32\drivers\etc\hosts -Pattern 'web-platform.test' -Quiet)) {
            throw 'web-platform.test is missing from the hosts file'
          }

      - name: Test
        if: matrix.suite == 'test'
        shell: bash
        run: |
          set -euo pipefail
          # Every crates/yuzuko [[test]] except wpt.
          tests=()
          while IFS= read -r name; do
            [[ "$name" == wpt ]] && continue
            tests+=(--test "$name")
          done < <(awk '
            $0 == "[[test]]" { grab=1; next }
            grab && $1 == "name" {
              gsub(/"/, "", $3)
              print $3
              grab=0
            }
          ' crates/yuzuko/Cargo.toml)
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "failed to read yuzuko integration tests" >&2
            exit 1
          fi
          cargo test --workspace --no-run
          # windows-2025 access-violates while cpal walks every WASAPI
          # endpoint. unknown_sink_is_unavailable does that search for a
          # missing name. audioOutputDevices still runs in
          # web_audio_passes_under_yuzuko_test.
          skip=
          if [ "$RUNNER_OS" = "Windows" ]; then
            skip="--skip output_device_names_are_usable_sinks --skip unknown_sink_is_unavailable"
          fi
          script=$RUNNER_TEMP/yuzuko-ci-test.sh
          {
            echo 'set -euo pipefail'
            echo "cargo test --workspace --exclude yuzuko -j1 --no-fail-fast -- --test-threads=1 $skip"
            printf 'cargo test -p yuzuko --lib --bins'
            printf ' %q' "${tests[@]}"
            echo " -j1 --no-fail-fast -- --test-threads=1 $skip"
          } > "$script"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" -- \
              bash "$script"
          else
            bash "$script"
          fi

      - name: WPT
        if: matrix.suite == 'wpt'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p yuzuko --test wpt --no-run
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" -- \
              cargo test -p yuzuko --test wpt -j1 --no-fail-fast -- --test-threads=1
          else
            cargo test -p yuzuko --test wpt -j1 --no-fail-fast -- --test-threads=1
          fi

  lint:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Linux Clippy links in the same distribution as the release binaries.
    # See the test job. Format does not link, so it stays on the runner.
    container: ${{ matrix.container }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            os: ubuntu-24.04
            task: fmt
            timeout: 15
          - name: Linux Clippy
            os: ubuntu-24.04
            container: ubuntu:20.04
            task: clippy
            timeout: 60
          - name: macOS Clippy
            os: macos-15
            task: clippy
            timeout: 60
          - name: Windows Clippy
            os: windows-2025
            task: clippy
            timeout: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install Linux packages
        if: matrix.container == 'ubuntu:20.04'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            sudo \
            build-essential \
            pkg-config \
            python3 \
            libgtk-3-dev \
            libxdo-dev \
            libudev-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            mesa-vulkan-drivers \
            libvulkan1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # Unit tests include_str! WPT JSON. Format does not compile.
          submodules: ${{ matrix.task == 'clippy' && 'recursive' || 'false' }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Format
        if: matrix.task == 'fmt'
        run: cargo fmt --all -- --check

      - name: CLI package
        if: matrix.task == 'fmt'
        run: node --test npm/cli/bin/yuzuko.test.js

      - name: Cache Cargo
        if: matrix.task == 'clippy'
        uses: Swatinem/rust-cache@v2
        with:
          # Objects linked on the runner's glibc do not belong in this cache.
          shared-key: ${{ matrix.container && 'yuzuko-clippy-focal' || 'yuzuko-clippy' }}

      - name: Restore the V8 static library
        if: matrix.task == 'clippy'
        shell: bash
        run: |
          set -euo pipefail
          # rust-cache keeps only build, .fingerprint, and deps. rusty_v8
          # puts librusty_v8.a in target/<profile>/gn_out, so a saved cache
          # does not contain it. Relinking v8 from that cache fails with
          # "could not find native static library `rusty_v8`" unless the
          # build script runs again and downloads the archive.
          shopt -s nullglob
          for profile in target/*/; do
            if [ ! -d "${profile}.fingerprint" ]; then
              continue
            fi
            if [ -e "${profile}gn_out/obj/librusty_v8.a" ] || \
              [ -e "${profile}gn_out/obj/rusty_v8.lib" ]; then
              continue
            fi
            to_remove=(
              "${profile}.fingerprint"/v8-*
              "${profile}build"/v8-*
              "${profile}deps"/libv8-*
              "${profile}deps"/v8-*
            )
            if [ "${#to_remove[@]}" -eq 0 ]; then
              continue
            fi
            echo "rusty_v8 archive missing in ${profile}; discarding cached v8 outputs"
            rm -rf "${to_remove[@]}"
          done

      - name: Clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # The installed @types/web pin. A Dependabot bump that yuzuko.d.ts does
  # not follow fails Compare, and that step log is the diff.
  web-types:
    name: Web types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install
        run: npm ci --prefix tools/web-types

      - name: Test
        run: node --test tools/web-types/lint.test.mjs

      - name: Compare
        run: node tools/web-types/lint.mjs

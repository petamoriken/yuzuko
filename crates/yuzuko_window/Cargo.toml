[package]
name = "yuzuko_window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard = "3"
gilrs = "0.11"
muda = "0.21"
png.workspace = true
pollster.workspace = true
v8.workspace = true
wgpu.workspace = true
winit = "0.30"
yuzuko_core.workspace = true
yuzuko_dom.workspace = true
yuzuko_macros.workspace = true
yuzuko_winter.workspace = true
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSMenu", "NSResponder", "NSRunningApplication", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = "0.3"

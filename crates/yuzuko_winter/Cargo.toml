[package]
name = "yuzuko_winter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fetch", "socket"]
fetch = [
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-rustls",
  "dep:hyper-util",
  "dep:h3",
  "dep:h3-quinn",
  "dep:ruzstd",
  "dep:quinn",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:webpki-roots",
]
socket = [
  "dep:quinn",
  "dep:web-transport-quinn",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:webpki-roots",
]

[dependencies]
aes = "0.9"
aes-gcm = { version = "0.11.1", features = ["hazmat"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
brotli.workspace = true
bytes.workspace = true
chacha20poly1305 = "0.11"
ed25519-dalek = { workspace = true, features = ["alloc", "pkcs8", "rand_core"] }
ed448-goldilocks = { version = "0.14.0-pre.15", default-features = false, features = [
  "signing",
  "pkcs8",
] }
encoding_rs.workspace = true
flate2 = { workspace = true, default-features = false, features = ["zlib-rs"] }
getrandom = "0.4"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
hkdf = "0.13.0"
hmac = "0.13.0"
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", optional = true, features = [
  "client",
  "server",
  "http1",
  "http2",
] }
hyper-rustls = { version = "0.27.10", optional = true, default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "tls12",
  "webpki-tokio",
] }
hyper-util = { version = "0.1.21", optional = true, features = [
  "tokio",
  "http1",
  "http2",
  "client-legacy",
] }
keccak = "0.2"
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "getrandom"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "getrandom"] }
ocb3 = "0.2"
p256 = { version = "0.14", default-features = false, features = [
  "ecdh",
  "ecdsa",
  "pkcs8",
  "std",
] }
p384 = { version = "0.14", default-features = false, features = [
  "ecdh",
  "ecdsa",
  "pkcs8",
  "std",
] }
p521 = { version = "0.14", default-features = false, features = [
  "ecdh",
  "ecdsa",
  "pkcs8",
  "std",
] }
pbkdf2 = "0.13.0"
quinn = { version = "0.11.12", optional = true, default-features = false, features = [
  "runtime-tokio",
  "rustls-ring",
] }
regex = "1"
rsa = { version = "0.9.8", features = ["sha1", "sha2"] }
rustls = { workspace = true, optional = true }
ruzstd = { version = "0.9.1", optional = true }
sha1 = "0.11.0"
sha1_10 = { package = "sha1", version = "0.10.6", features = ["oid"] }
sha2.workspace = true
sha3 = "0.12"
slh-dsa = { version = "0.2.0-rc.5", default-features = false, features = ["alloc"] }
tokio = { workspace = true, optional = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26.6", optional = true }
url.workspace = true
urlpattern = "0.6.0"
v8.workspace = true
web-transport-quinn = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
x25519-dalek = { version = "3.0.0", default-features = false, features = [
  "static_secrets",
] }
x448 = { version = "0.14.0-pre.12", default-features = false }
yuzuko_core.workspace = true
yuzuko_macros.workspace = true

[dev-dependencies]
rcgen.workspace = true
# 0.103.16 rejects the compromised eMudhra intermediate SPKIs
# (RUSTSEC-2026-0382). The distrust list is not public.
rustls-webpki = { version = "0.103.16", features = ["ring"] }

[package]
name = "yuzuko_winter"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fetch", "socket"]
fetch = [
  "dep:http-body-util",
  "dep:hyper",
  "dep:hyper-rustls",
  "dep:hyper-util",
  "dep:h3",
  "dep:h3-quinn",
  "dep:ruzstd",
  "dep:quinn",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:webpki-roots",
]
socket = [
  "dep:quinn",
  "dep:web-transport-quinn",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:rustls",
  "dep:webpki-roots",
]

[dependencies]
bytes = "1.12.1"
encoding_rs.workspace = true
flate2 = { workspace = true, default-features = false, features = ["zlib-rs"] }
getrandom = "0.3"
rustls = { workspace = true, optional = true }
http-body-util = { version = "0.1.5", optional = true }
hyper = { version = "1.12.0", optional = true, features = ["client", "server", "http1", "http2"] }
hyper-rustls = { version = "0.27.10", optional = true, default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "tls12",
  "webpki-tokio",
] }
hyper-util = { version = "0.1.21", optional = true, features = ["tokio", "http1", "http2", "client-legacy"] }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
quinn = { version = "0.11.12", optional = true, default-features = false, features = ["runtime-tokio", "rustls-ring"] }
web-transport-quinn = { version = "0.13.2", optional = true, default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26.6", optional = true }
webpki-roots = { workspace = true, optional = true }
tokio = { version = "1.53.3", optional = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
url.workspace = true
v8.workspace = true
yuzuko_core.workspace = true
yuzuko_macros.workspace = true
urlpattern = "0.6.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
hmac = "0.13.0"
aes-gcm = { version = "0.11.1", features = ["hazmat"] }
pbkdf2 = "0.13.0"
regex = "1"
hkdf = "0.13.0"
rsa = { version = "0.9.8", features = ["sha1", "sha2"] }
sha1_10 = { package = "sha1", version = "0.10.6", features = ["oid"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
p521 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
ed25519-dalek = { workspace = true, features = ["alloc", "pkcs8", "rand_core"] }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets"] }
brotli = "9.0.0"
ruzstd = { version = "0.9.1", optional = true }
ed448-goldilocks = { version = "0.14.0-pre.15", default-features = false, features = ["signing", "pkcs8"] }
x448 = { version = "0.14.0-pre.12", default-features = false }
sha3 = "0.12"
chacha20poly1305 = "0.11"
ocb3 = "0.2"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "getrandom"] }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc", "getrandom"] }
slh-dsa = { version = "0.2.0-rc.5", default-features = false, features = ["alloc"] }
keccak = "0.2"
aes = "0.9"

[dev-dependencies]
rcgen = "0.13"
# 0.103.16 rejects the compromised eMudhra intermediate SPKIs
# (RUSTSEC-2026-0382). The distrust list is not public.
rustls-webpki = { version = "0.103.16", features = ["ring"] }

[package]
name = "yuzuko"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
autotests = false

[[bin]]
name = "yuzuko"
path = "src/main.rs"

[features]
default = [
  "fetch",
  "fs",
  "socket",
  "udp",
  "tcp",
  "http",
  "signal",
  "child",
  "ffi",
  "window",
  "accessibility",
  "image",
  "canvas",
  "webgpu",
  "audio",
  "codec",
]
fetch = ["yuzuko_dom/fetch", "yuzuko_winter/fetch"]
fs = ["yuzuko_core/fs"]
socket = ["yuzuko_dom/socket", "yuzuko_winter/socket"]
udp = ["yuzuko_core/udp"]
tcp = ["yuzuko_core/tcp"]
http = ["yuzuko_core/http"]
signal = ["yuzuko_core/signal"]
child = ["yuzuko_core/child"]
ffi = ["yuzuko_core/ffi"]
window = ["dep:yuzuko_window", "yuzuko_dom/window"]
accessibility = ["window", "yuzuko_window/accessibility"]
image = ["dep:yuzuko_image", "window"]
canvas = ["dep:yuzuko_canvas", "image"]
webgpu = ["dep:yuzuko_webgpu", "image"]
audio = ["dep:yuzuko_audio"]
codec = ["dep:yuzuko_codec", "image"]

[dependencies]
base64 = "0.23"
ed25519-dalek.workspace = true
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true
v8.workspace = true
webpki-roots.workspace = true
yuzuko_audio = { workspace = true, optional = true }
yuzuko_canvas = { workspace = true, optional = true }
yuzuko_codec = { workspace = true, optional = true }
yuzuko_core.workspace = true
yuzuko_dom.workspace = true
yuzuko_image = { workspace = true, optional = true }
yuzuko_webgpu = { workspace = true, optional = true }
yuzuko_window = { workspace = true, optional = true }
yuzuko_winter.workspace = true

[dev-dependencies]
base64 = "0.23"
bytes = "1.12.1"
ed25519-dalek.workspace = true
libc.workspace = true
rcgen = "0.13"
rustls.workspace = true
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "sync", "time"] }
web-transport-quinn = { version = "0.13.2", default-features = false, features = ["ring"] }
# Optional crates stay normal dependencies of their features. Listing one
# here would turn its features on for `cargo test --no-default-features`.
yuzuko_core.workspace = true
yuzuko_dom.workspace = true
yuzuko_winter.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[[test]]
name = "accessibility"
required-features = ["accessibility"]

[[test]]
name = "audio"
required-features = ["audio"]

[[test]]
name = "cli"
required-features = ["fetch", "fs", "socket", "window", "image", "canvas", "webgpu", "audio", "codec"]

[[test]]
name = "clipboard"
required-features = ["window"]

[[test]]
name = "context_menu"
required-features = ["window"]

[[test]]
name = "dialog"
required-features = ["window"]

[[test]]
name = "file_drop"
required-features = ["window"]

[[test]]
name = "fetch_feature"

[[test]]
name = "canvas_composite"
required-features = ["canvas"]

[[test]]
name = "font"
required-features = ["canvas"]

[[test]]
name = "fs_feature"

[[test]]
name = "gamepad"
required-features = ["window"]

[[test]]
name = "keyboard_lock"
required-features = ["window"]

[[test]]
name = "menu"
required-features = ["window"]

[[test]]
name = "navigator"
required-features = ["window"]

[[test]]
name = "package"
required-features = ["window", "fetch"]

[[test]]
name = "repl"
required-features = ["window"]

[[test]]
name = "runtime_feature"

[[test]]
name = "tray"
required-features = ["window"]

[[test]]
name = "update"

[[test]]
name = "image_decoder"
required-features = ["codec", "canvas"]

[[test]]
name = "mp4"
required-features = ["codec"]

[[test]]
name = "webcodecs"
required-features = ["codec"]

[[test]]
name = "webgpu"
required-features = ["webgpu"]

[[test]]
name = "webtransport"
required-features = ["socket"]

[[test]]
name = "window"
required-features = ["canvas"]

[[test]]
name = "worker"
required-features = ["canvas", "webgpu"]

[[test]]
name = "wpt"
required-features = ["fetch", "socket", "window", "image", "canvas", "webgpu", "audio", "codec"]


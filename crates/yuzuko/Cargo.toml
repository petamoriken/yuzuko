[package]
name = "yuzuko"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "yuzuko"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
ed25519-dalek.workspace = true
rustls.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url.workspace = true
v8.workspace = true
webpki-roots.workspace = true
yuzuko_audio.workspace = true
yuzuko_canvas.workspace = true
yuzuko_codec.workspace = true
yuzuko_core.workspace = true
yuzuko_dom.workspace = true
yuzuko_image.workspace = true
yuzuko_webgpu.workspace = true
yuzuko_window.workspace = true
yuzuko_winter.workspace = true

[dev-dependencies]
base64 = "0.23"
bytes = "1.12.1"
ed25519-dalek.workspace = true
libc.workspace = true
rcgen = "0.13"
rustls.workspace = true
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["macros", "net", "rt", "sync", "time"] }
web-transport-quinn = { version = "0.13.2", default-features = false, features = ["ring"] }
yuzuko_audio.workspace = true
yuzuko_core.workspace = true
yuzuko_dom.workspace = true
yuzuko_image.workspace = true
yuzuko_webgpu.workspace = true
yuzuko_window.workspace = true
yuzuko_winter.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

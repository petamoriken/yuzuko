[workspace]
members = [
  "crates/yuzuko",
  "crates/yuzuko_core",
  "crates/yuzuko_dom",
  "crates/yuzuko_macros",
  "crates/yuzuko_winter",
  "crates/yuzuko_window",
  "crates/yuzuko_image",
  "crates/yuzuko_canvas",
  "crates/yuzuko_webgpu",
  "crates/yuzuko_audio",
  "crates/yuzuko_codec",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
publish = false

[workspace.dependencies]
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_codegen = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_span = "=0.154.0"
oxc_transformer = "=0.154.0"
oxc_resolver = "=11.24.3"
encoding_rs = "0.8"
url = "2"
v8 = "152"
libc = "0.2"
png = "0.18"
# vello_gpu 0.3.0 and vello_cpu 0.3.0 require wgpu 30. Bump these together.
wgpu = "30"
vello_gpu = { version = "0.3.0", default-features = false, features = ["wgpu", "text"] }
vello_cpu = { version = "0.3.0", features = ["f32_pipeline"] }
half = "2"
image-webp = "0.2"
pollster = "1.0"
flate2 = "1"
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
# 1.0.10 drops emSign ECC Root CA - G3 after the eMudhra compromise.
# 1.0.11 also drops emSign Root CA - C1 and emSign ECC Root CA - C3.
webpki-roots = "1.0.11"
ed25519-dalek = "3.0.0"
symphonia = { version = "0.6", default-features = false }
ruopus = "0.1.2"
# Software AV1. Assembly needs nasm on x86 and stays off.
rav1d = { version = "1.1.0", default-features = false }
avif-parse = "2.1.0"
brotli = "9.0.0"
bytes = "1.12.1"
rcgen = "0.14"
sha2 = "0.11.1"
tokio = "1.53.3"
web-transport-quinn = { version = "0.13.2", default-features = false, features = [
  "ring",
] }
windows = "0.62"
windows-sys = "0.61"
yuzuko_audio = { path = "crates/yuzuko_audio" }
yuzuko_canvas = { path = "crates/yuzuko_canvas" }
yuzuko_codec = { path = "crates/yuzuko_codec" }
yuzuko_core = { path = "crates/yuzuko_core", default-features = false }
yuzuko_dom = { path = "crates/yuzuko_dom", default-features = false }
yuzuko_image = { path = "crates/yuzuko_image" }
yuzuko_macros = { path = "crates/yuzuko_macros" }
yuzuko_webgpu = { path = "crates/yuzuko_webgpu" }
yuzuko_window = { path = "crates/yuzuko_window" }
yuzuko_winter = { path = "crates/yuzuko_winter", default-features = false }

# The packaged binary optimizes for size. Hot crates below stay at speed.
# `bench` matches `release`. Panic stays unwind so `catch_unwind` can turn a
# decoder panic into `InvalidStateError`.
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[profile.bench]
codegen-units = 1
lto = true
opt-level = "z"

# Faster local release builds. The shipped binary is `release`.
[profile.release-lite]
inherits = "release"
incremental = true
codegen-units = 128
lto = "thin"

# rusty_v8 miscompiles at opt-level 0.
[profile.dev.package.v8]
opt-level = 1

# RSA key generation is too slow to exercise at opt-level 0.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# A 320x320 60-frame JPEG XL exceeds the 8s WPT deadline at opt-level 0.
[profile.dev.package.jxl-oxide]
opt-level = 3
[profile.dev.package.jxl-render]
opt-level = 3
[profile.dev.package.jxl-modular]
opt-level = 3
[profile.dev.package.jxl-frame]
opt-level = 3
[profile.dev.package.jxl-vardct]
opt-level = 3
[profile.dev.package.jxl-color]
opt-level = 3
[profile.dev.package.jxl-coding]
opt-level = 3
[profile.dev.package.jxl-grid]
opt-level = 3

# rav1d without assembly is too slow at opt-level 0 for a decoded frame.
[profile.dev.package.rav1d]
opt-level = 3

# Speed for the runtime and the libraries on its hot path. Everything else
# stays at opt-level "z". Repeated for `bench` so measurements match release.
# Package overrides do not inherit across profiles.
[profile.release.package.yuzuko]
